[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dgimage"
version = "0.1.0"
description = "Lightweight image transformations for holography and microscopy"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "David G. Grier", email = "david.grier@nyu.edu" },
]
keywords = [
    "image processing", "feature detection", "holography", "microscopy",
    "orientation alignment transform", "scientific",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/davidgrier/dgimage"
Documentation = "https://dgimage.readthedocs.io"
Repository = "https://github.com/davidgrier/dgimage"
"Bug Tracker" = "https://github.com/davidgrier/dgimage/issues"

[project.optional-dependencies]
# OpenCV is optional: the derivative filter of the circle transform is
# several times faster with it, and gives the same numbers.
fast = ["opencv-python-headless"]
test = ["dgimage[fast]", "pytest", "pytest-cov"]
# pyright is pinned: a newer version finds new things, and they are for us to
# fix when we choose to move (change the pin and the report together).
dev = ["dgimage[test]", "ruff", "pyright==1.1.414"]
docs = ["pydata-sphinx-theme", "sphinx", "sphinx-autodoc-typehints"]

[tool.setuptools]
packages = ["dgimage"]

[tool.setuptools.package-data]
dgimage = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests", "dgimage"]
addopts = "--doctest-modules --doctest-glob='' --ignore=docs"

[tool.coverage.run]
source = ["dgimage"]

[tool.coverage.report]
fail_under = 95

[tool.ruff]
line-length = 79
extend-exclude = ["devel"]

[tool.ruff.lint]
select = ["F", "B", "E501", "SIM", "RUF012", "PLW2901", "UP037", "PERF",
          "PIE"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E501", "F401", "F811", "F841", "B018", "B905", "SIM",
             "RUF012", "PLW2901", "UP037", "PERF", "PIE"]

[tool.pyright]
include = ["dgimage"]
typeCheckingMode = "standard"
